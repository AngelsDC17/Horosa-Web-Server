name: horosa-web-server
static_sites:
  - name: horosa-frontend
    github:
      repo: Horace-Maxwell/Horosa-Web-Server
      branch: main
      deploy_on_push: true
    source_dir: astrostudyui
    environment_slug: node-js
    build_command: npm ci --ignore-scripts --no-audit --no-fund && node scripts/patch_quill_domnodeinserted.js && npm run build:digitalocean
    output_dir: dist
    index_document: index.html
    catchall_document: index.html
    envs:
      - key: HOROSA_PUBLIC_SERVER_ROOT
        value: /api
        scope: BUILD_TIME
        type: GENERAL
      - key: HOROSA_PUBLIC_PATH
        value: /
        scope: BUILD_TIME
        type: GENERAL
      - key: HOROSA_LOW_MEMORY_BUILD
        value: "1"
        scope: BUILD_TIME
        type: GENERAL
      - key: NODE_OPTIONS
        value: "--openssl-legacy-provider --max-old-space-size=640"
        scope: BUILD_TIME
        type: GENERAL
